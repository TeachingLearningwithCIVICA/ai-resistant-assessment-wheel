/* ===== The wheel (the author's geometry and behaviour) ===== */
const RINGS = T.rings.map(r => Object.assign({}, r, COLOURS.rings[r.id]));
const SEGS = T.segs.map(s => Object.assign({}, s, { color: COLOURS.segs[s.id] }));
const N = SEGS.length, DEG = 360 / N;
SEGS.forEach((s, i) => { s.a1 = i * DEG; s.a2 = (i + 1) * DEG; });
const rad = d => d * Math.PI / 180;
function arc(r1, r2, a1, a2, g){
  g = g === undefined ? 1.6 : g;
  const s = rad(a1 + g), e = rad(a2 - g), C = Math.cos, S = Math.sin, lg = (a2 - a1) > 180 ? 1 : 0;
  return `M${r1*C(s)},${r1*S(s)}L${r2*C(s)},${r2*S(s)}A${r2},${r2},0,${lg},1,${r2*C(e)},${r2*S(e)}L${r1*C(e)},${r1*S(e)}A${r1},${r1},0,${lg},0,${r1*C(s)},${r1*S(s)}Z`;
}
function rtext(r, midDeg, lines, sz, fill, bold){
  const mr = rad(midDeg), x = r * Math.cos(mr), y = r * Math.sin(mr);
  const tr = (midDeg + 90) % 360, rot = (tr > 90 && tr < 270) ? ((tr + 180) % 360) : tr;
  const lh = sz * 1.3, total = (lines.length - 1) * lh;
  let t = `<text transform="rotate(${rot},${x},${y})" text-anchor="middle" font-weight="${bold ? 800 : 600}" font-size="${sz}" fill="${fill}">`;
  lines.forEach((l, i) => { t += `<tspan x="${x}" y="${y}" dy="${-total/2 + i*lh}" dominant-baseline="middle">${esc(l)}</tspan>`; });
  return t + `</text>`;
}
let activeSegId = null, activeBloom = "evaluate";

function build(){
  let h = "";
  const OR1 = 170, OR2 = 230;
  SEGS.forEach(seg => {
    const mid = (seg.a1 + seg.a2) / 2;
    const label = COLOURS.darkLabel.includes(seg.id) ? "#1a1a1a" : "#ffffff";
    h += `<g class="wseg" data-id="${seg.id}">`;
    h += `<path d="${arc(OR1, OR2, seg.a1, seg.a2, 2)}" fill="${seg.color}" stroke="var(--wheel-gap)" stroke-width="3"/>`;
    h += rtext((OR1 + OR2) / 2, mid, seg.label.split("\n"), 13, label, true);
    h += `</g>`;
  });
  const IR1 = 60, IR2 = 155, bloomDeg = 360 / 3, bloomStart = -90;
  RINGS.forEach((ring, i) => {
    const a1 = bloomStart + i * bloomDeg, a2 = a1 + bloomDeg, mid = a1 + bloomDeg / 2;
    h += `<g class="bloom-seg" data-bloom="${ring.id}">`;
    h += `<path d="${arc(IR1, IR2, a1, a2, 2)}" fill="${ring.fill}" stroke="var(--wheel-gap)" stroke-width="3"/>`;
    h += rtext((IR1 + IR2) / 2, mid, [ring.label], 16, ring.text, true);
    h += `</g>`;
  });
  h += `<circle r="57" fill="#ffffff" stroke="#e0ddd8" stroke-width="1.5"/>`;
  T.hubLines.forEach((l, i) => { h += `<text y="${-11 + i*14}" text-anchor="middle" font-size="10" fill="#3C3489" font-weight="800">${esc(l)}</text>`; });
  [57, 155, 160, 170, 230].forEach(r => { h += `<circle r="${r}" fill="none" stroke="var(--wheel-gap)" stroke-width="1.5" opacity="0.5"/>`; });
  const svg = $("wsvg"); svg.innerHTML = h;
  svg.querySelectorAll(".wseg").forEach(g => g.addEventListener("click", () => click_seg(g.dataset.id)));
  svg.querySelectorAll(".bloom-seg").forEach(g => g.addEventListener("click", () => sel_bloom(g.dataset.bloom)));

  /* Chips: same eight types as real buttons */
  const chips = $("chips"); chips.setAttribute("aria-label", T.chipsLabel);
  chips.innerHTML = SEGS.map(s => `<button type="button" class="chip" data-id="${s.id}" aria-pressed="false" aria-controls="panel"><span class="dot" style="background:${s.color}" aria-hidden="true"></span>${esc(s.label.replace("\n", " "))}</button>`).join("");
  chips.querySelectorAll(".chip").forEach(b => b.addEventListener("click", () => click_seg(b.dataset.id)));

  /* Level buttons in the panel (the author's three pills) */
  $("bloom-tabs").innerHTML = RINGS.map(r => `<button type="button" class="bloom-pill" data-bloom="${r.id}" aria-pressed="false" style="--pill-fill:${r.fill};--pill-text:${r.text}">${esc(r.label)}</button>`).join("");
  document.querySelectorAll(".bloom-pill").forEach(b => b.addEventListener("click", () => sel_bloom(b.dataset.bloom)));

  /* Verb legend */
  $("verb-legend").innerHTML = RINGS.map(r => `
    <div class="vl-item" style="--vl-label:${r.text};--vl-fill:${r.fill}">
      <div class="vl-dot" style="background:${r.fill}" aria-hidden="true"></div>
      <div class="vl-text"><strong>${esc(r.label)}</strong> <span>${esc(r.verbs.join("  ·  "))}</span></div>
    </div>`).join("");
}

function sync(){
  document.querySelectorAll(".wseg").forEach(e => {
    e.classList.remove("active", "dimmed");
    if (activeSegId) e.classList.add(e.dataset.id === activeSegId ? "active" : "dimmed");

  document.querySelectorAll(".chip").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === activeSegId)));
  document.querySelectorAll(".bloom-pill").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.bloom === activeBloom)));
  document.querySelectorAll(".bloom-seg").forEach(el => { el.style.opacity = !activeSegId || el.dataset.bloom === activeBloom ? "1" : "0.45"; });
  $("panel").hidden = !activeSegId;
  $("hint").hidden = !!activeSegId;
  $("reset-btn").hidden = !activeSegId;
}

  $("live").textContent = seg.label.replace("\n", " ") + " — " + ring.label;
}
function click_seg(id){
  activeSegId = activeSegId === id ? null : id;      /* clicking the open type closes it, as before */
  if (activeSegId) open_panel(SEGS.find(s => s.id === id));
  sync(); announce();
}
function open_panel(seg){
  $("pn").textContent = seg.label.replace("\n", " ");
  $("panel").style.setProperty("--seg", seg.color);
  $("panel").style.setProperty("--seg-title", COLOURS.titleText[seg.id] || seg.color);
  $("pd").textContent = seg.desc;
  show_content(seg, activeBloom);
  setTimeout(() => { const p = $("panel"); if (typeof p.scrollIntoView === "function") p.scrollIntoView({ behavior: reduced() ? "auto" : "smooth", block: "nearest" }); }, 80);
}
function sel_bloom(bloomId){
  activeBloom = bloomId;
  if (activeSegId) show_content(SEGS.find(s => s.id === activeSegId), bloomId);
  sync(); announce();
}
function show_content(seg, bloomId){
  const c = seg.content[bloomId]; if (!c) return;
  $("pros").innerHTML = c.pros.map(p => `<li>${esc(p)}</li>`).join("");
  $("cons2").innerHTML = c.cons.map(x => `<li>${esc(x)}</li>`).join("");
  $("pai").textContent = c.ai;
}
function reset_wheel(){
  activeSegId = null; activeBloom = "evaluate";
  sync(); announce();
  const first = document.querySelector(".chip"); if (first) first.focus();   /* the reset button disappears, so focus moves */
}
$("reset-btn").addEventListener("click", reset_wheel);
build(); sync();

/* ===== CIVICA frame ===== */
$("t-skip").textContent = T.skip; $("t-mark").setAttribute("aria-label", T.markLabel); $("t-mark-sub").textContent = T.markSub;
document.querySelectorAll('.attribution a[target="_blank"]').forEach(a => { const sp = document.createElement("span"); sp.className = "sr-only"; sp.textContent = T.newTab; a.appendChild(sp); });
$("t-lbl-author").textContent = T.lblAuthor; $("t-lbl-published").textContent = T.lblPublished;
$("t-lbl-part").textContent = T.lblPart; $("t-lbl-licence").textContent = T.lblLicence; $("t-funding").textContent = T.funding;
$("t-licence").innerHTML = esc(T.licence).replace("{link}", '<a href="' + LICENCE_URL + '" target="_blank" rel="noopener noreferrer license">' + esc(LICENCE_NAME) + '<span class="sr-only">' + esc(T.newTab) + '</span></a>');
const pd = $("published-date"); pd.setAttribute("datetime", PUBLISHED);
pd.textContent = new Intl.DateTimeFormat("en-GB", { day:"numeric", month:"long", year:"numeric", timeZone:"UTC" }).format(new Date(PUBLISHED + "T12:00:00Z"));
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 1.8v2.4M12 19.8v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a7 7 0 0 0 11.1 11.1z"/></svg>';
function updateThemeButton(){
  const dark = document.documentElement.dataset.theme === "dark";
  $("theme-icon").innerHTML = dark ? SUN : MOON;
  $("theme-label").textContent = dark ? T.themeToLight : T.themeToDark;
  $("theme-btn").setAttribute("aria-pressed", String(dark));
  $("theme-btn").setAttribute("aria-label", dark ? T.themeToLightLabel : T.themeToDarkLabel);
}
$("theme-btn").addEventListener("click", () => {
  document.documentElement.dataset.theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  updateThemeButton();
});
updateThemeButton();
})();
</script>
</body>
</html>
